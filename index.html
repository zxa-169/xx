<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色地球公益联盟</title>

    <style>
        :root {
            --green:#2e7d32;
            --light:#e8f5e9;
            --text:#333;
        }

        body {
            margin:0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--light);
            color: var(--text);
        }

        header {
            background: var(--green);
            color:white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background:white;
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        nav a{
            margin:0 12px;
            text-decoration:none;
            color:var(--green);
            font-weight:bold;
        }

        .hero {
            padding:60px 20px;
            text-align:center;
            background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1500&q=80') center/cover no-repeat;
            color:white;
        }

        .hero h1 {
            font-size:2.3rem;
            text-shadow:1px 1px 4px rgba(0,0,0,.4);
        }

        .hero p {
            margin-top:10px;
        }

        section {
            max-width:900px;
            margin:40px auto;
            padding:0 20px;
            text-align:center;
        }

        h2{
            color:var(--green);
            margin-bottom:10px;
        }

        .card-grid {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:8px;
            border:1px solid #ddd;
        }

        footer{
            text-align:center;
            padding:20px;
            background:#1b5e20;
            color:white;
            margin-top:40px;
            font-size:14px;
        }
    </style>
</head>
<body>

<header>
    <h1>绿色地球公益联盟</h1>
    <p>Green Earth Public Welfare Organization</p>
</header>

<nav>
    <a href="#">首页</a>
    <a href="#">环保倡议</a>
    <a href="#">志愿者</a>
    <a href="#">联系我们</a>
</nav>

<div class="hero">
    <h1>保护环境 · 从我们开始</h1>
    <p>节约能源、减少污染、守护蓝天绿地。</p>
</div>

<section>
    <h2>我们的目标</h2>
    <p>我们致力于推动环保意识，建设绿色未来，让地球恢复自然生态与健康。</p>

    <div class="card-grid">
        <div class="card">
            <h3>🌱 生态保护</h3>
            <p>推动植树造林和自然保护教育。</p>
        </div>
        <div class="card">
            <h3>♻️ 垃圾减量</h3>
            <p>支持减少塑料和垃圾分类行动。</p>
        </div>
        <div class="card">
            <h3>💧 水资源保护</h3>
            <p>珍惜每一滴水，共同保护淡水生态。</p>
        </div>
    </div>
</section>

<footer>
    © 2025 绿色地球公益联盟 ｜ Protect The Earth. All Rights Reserved.
</footer>

</body>
</html>
